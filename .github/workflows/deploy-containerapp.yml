name: Build and deploy Container App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Required secrets:
    # - AZURE_CREDENTIALS
    # - ACR_LOGIN_SERVER
    # - ACR_USERNAME
    # - ACR_PASSWORD
    # - AZURE_RESOURCE_GROUP
    # - AZURE_CONTAINERAPP_NAME
    # - FOUNDRY_ENDPOINT
    # - gpt_endpoint
    # - embedding_endpoint
    # - phi_4_endpoint
    env:
      IMAGE_NAME: ${{ secrets.ACR_LOGIN_SERVER }}/tomorrow-demo:${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}

      - name: Update Azure Container App
        shell: bash
        run: |
          az containerapp update \
            --name "${{ secrets.AZURE_CONTAINERAPP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --image "${{ env.IMAGE_NAME }}" \
            --set-env-vars \
              FOUNDRY_ENDPOINT="${{ secrets.FOUNDRY_ENDPOINT }}" \
              gpt_endpoint="${{ secrets.gpt_endpoint }}" \
              embedding_endpoint="${{ secrets.embedding_endpoint }}" \
              phi_4_endpoint="${{ secrets.phi_4_endpoint }}"
